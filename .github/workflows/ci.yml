name: CI

permissions:
  contents: read
  issues: write

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  python:
    name: Python — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements/*.txt
            packages/*/pyproject.toml
            services/*/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Ruff
        run: ruff check . --output-format=github

      - name: Mypy
        run: mypy services/api/app packages/forecasting/src services/worker/worker packages/contracts/src

      - name: Forecasting library tests
        run: pytest packages/forecasting/tests -q

      - name: Contract drift tests
        run: pytest packages/contracts/tests -q

      - name: API integration tests
        run: pytest tests -q

  web:
    name: Web — types, lint, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: Browser — Playwright flow
    runs-on: ubuntu-latest
    needs: [python, web]
    timeout-minutes: 25
    # The official Playwright image ships Chromium pre-installed, so the job never depends on
    # a browser CDN download at run time.
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Python runtime for the test server
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv curl

      # scripts/e2e-server.sh expects a repo-root .venv, so build one here rather than
      # letting the runner pick a different interpreter.
      - name: Python environment for the e2e server
        run: |
          python3 -m venv .venv
          ./.venv/bin/python -m pip install --upgrade pip
          ./.venv/bin/pip install -r requirements/dev.txt

      - name: Node dependencies
        working-directory: apps/web
        run: npm ci

      - name: Playwright
        working-directory: apps/web
        env:
          CI: "true"
          FORECASTOPS_PYTHON: ${{ github.workspace }}/.venv/bin/python
          FORECASTOPS_ALEMBIC: ${{ github.workspace }}/.venv/bin/alembic
        run: |
          set -o pipefail
          npx playwright test 2>&1 | tee /tmp/pw.log

      # Actions logs are unreachable from some development sandboxes; the GitHub API is not.
      # Echo the failure tail onto the pull request so it can be debugged from anywhere.
      - name: Post failure tail to the pull request
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/ci-post-failure.py /tmp/pw.log

      - name: Echo the report tail on failure
        if: failure()
        working-directory: apps/web
        run: tail -n 120 playwright-report/index.html 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
