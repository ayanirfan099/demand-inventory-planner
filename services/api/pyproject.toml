[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastops-api"
version = "0.1.0"
description = "ForecastOps API service."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "psycopg[binary]>=3.1",
  "forecastops-forecasting>=0.1.0",
]

[project.optional-dependencies]
queue = ["redis>=5.0", "rq>=1.16"]
dev = ["pytest>=7.4", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["app*"]
