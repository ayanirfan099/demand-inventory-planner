[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecastops-worker"
version = "0.1.0"
description = "ForecastOps background worker (RQ on Redis, or a database poller)."
requires-python = ">=3.11"
dependencies = [
  "forecastops-api>=0.1.0",
  "redis>=5.0",
  "rq>=1.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]
